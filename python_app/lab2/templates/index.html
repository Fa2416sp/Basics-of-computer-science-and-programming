<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Текстовый редактор</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 2rem; background-color: #f8f9fa; }
    pre { background-color: #fff; padding: 1rem; border-radius: 0.5rem; }
    .output-box { white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="mb-4">📝 Командный Текстовый Редактор</h1>
    <form method="post" class="mb-4">
      <div class="input-group">
        <input type="text" class="form-control" name="command" placeholder='Например: insert "Привет" 1 0'>
        <button class="btn btn-primary" type="submit">Выполнить</button>
      </div>
    </form>

    <h4>📄 Содержимое файла:</h4>
    <pre>{{ lines|join('\n') }}</pre>

    {% if output %}
      <div class="mt-4">
        <h5>Результат:</h5>
        <div class="alert alert-info output-box">{{ output }}</div>
      </div>
    {% endif %}
  </div>
</body>
</html>
